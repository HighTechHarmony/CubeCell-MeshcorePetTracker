; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build dir moved to local disk to avoid NFS stale-file-handle errors from arm-none-eabi-ar
build_dir = /tmp/pio_cubecell_pettracker

[env:cubecell_gps]
platform = heltec-cubecell
board = cubecell_gps
framework = arduino
monitor_speed = 115200
; GPS tracker sketch uses Radio.h directly — no LoRaWAN stack included.
; C++11 is required for static_assert (should be default for ARM GCC ≥5).
; To disable debug prints for production builds, add a build flag:
; build_flags = -DDEBUG=0
